packages:
  - apps/*
  - packages/*

allowBuilds:
  '@nestjs/core': true
  esbuild: true
  argon2: true
  '@parcel/watcher': true
  '@swc/core': true

minimumReleaseAgeExclude:
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - icu-minify@4.14.6
  - next-intl-swc-plugin-extractor@4.14.6
  - next-intl@4.14.6
  - use-intl@4.14.6
