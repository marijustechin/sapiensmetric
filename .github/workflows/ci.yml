name: CI

# Pull requests and non-main pushes run the full local gate and NEVER deploy.
# `pnpm verify` includes lint, typecheck, unit/contract/API tests, FSD boundaries,
# the web + API build, the static-export invariant, and the public-release
# freshness/completeness check.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

# Least privilege: CI reads the repository and needs no production secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public, non-secret build input; the static export fails closed without it.
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.sapiensmetric.eu' }}

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify
